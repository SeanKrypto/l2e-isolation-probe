{
  "name": "L2E source-free aggregate Docker inventory R3",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {},
  "concurrency": {
    "group": "l2e-isolation-image-inventory",
    "cancel-in-progress": false
  },
  "jobs": {
    "inventory": {
      "if": "github.event_name == 'workflow_dispatch' && github.run_attempt == '1'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "steps": [
        {
          "name": "Read aggregate local image metadata only",
          "shell": "bash",
          "timeout-minutes": 1,
          "run": "set -euo pipefail\nexport PATH=/usr/bin:/bin\nenv -i PATH=/usr/bin:/bin python3 -I -S - <<'PY'\n\"\"\"Source-free, aggregate-only Linux Docker inventory. No invocation during qualification.\"\"\"\nimport json\nimport os\nimport re\nimport selectors\nimport shutil\nimport signal\nimport stat\nimport subprocess\nimport sys\nimport tempfile\nimport time\n\nSTDOUT_LIMIT = 65536\nSTDERR_LIMIT = 8192\nMAX_ROWS = 64\nPOLICY = 'LOCAL_IMAGE_METADATA_V1'\nPUBLIC_REPOSITORIES = frozenset(('ubuntu', 'debian', 'alpine', 'node', 'python'))\nVERSION_ARGS = ('version', '--format',\n                '{\"client\":{{json .Client.Version}},\"server\":{{json .Server.Version}}}')\nIMAGE_ARGS = ('image', 'ls', '--digests', '--no-trunc', '--format',\n              '{\"repository\":{{json .Repository}},\"tag\":{{json .Tag}},'\n              '\"digest\":{{json .Digest}},\"image_id\":{{json .ID}}}')\nCODES = frozenset(('OK', 'UNSUPPORTED_PLATFORM', 'SETUP_FAILED', 'READ_FAILED',\n                   'OUTPUT_LIMIT', 'TIMEOUT', 'INVALID_JSON', 'INVALID_RECORD',\n                   'TOO_MANY_ROWS', 'NO_METADATA_CANDIDATE',\n                   'CHILD_CLEANUP_UNKNOWN', 'TEMP_CLEANUP_FAILED', 'INTERNAL_ERROR',\n                   'INTERRUPTED', 'SIGNAL_SETUP_FAILED', 'SIGNAL_RESTORE_FAILED'))\n\n\nclass InventoryError(Exception):\n    def __init__(self, code):\n        self.code = code if code in CODES else 'INTERNAL_ERROR'\n        super().__init__(self.code)\n\n\nclass InventoryInterrupted(BaseException):\n    pass\n\n\nclass Lifecycle:\n    \"\"\"Handled parent interruption stays owned until bounded child cleanup completes.\"\"\"\n    def __init__(self):\n        self.cancelled = False\n        self.cleaning = False\n        self.handlers = {}\n        self.process_cleanup = 'NOT_STARTED'\n\n    def handle(self, signum, frame):\n        self.cancelled = True\n        if not self.cleaning:\n            raise InventoryInterrupted()\n\n    def install(self):\n        try:\n            for name in ('SIGINT', 'SIGTERM'):\n                sig = getattr(signal, name)\n                old = signal.getsignal(sig)\n                self.handlers[sig] = old\n                signal.signal(sig, self.handle)\n        except BaseException:\n            raise InventoryError('SIGNAL_SETUP_FAILED') from None\n\n    def restore(self):\n        ok = True\n        for sig, previous in self.handlers.items():\n            try:\n                signal.signal(sig, previous)\n            except BaseException:\n                ok = False\n        return ok\n\n\ndef require(condition, code='INVALID_RECORD'):\n    if not condition:\n        raise InventoryError(code)\n\n\ndef strict_json(raw):\n    require(type(raw) is bytes and len(raw) <= STDOUT_LIMIT, 'INVALID_JSON')\n    def unique(pairs):\n        result = {}\n        for key, value in pairs:\n            require(key not in result, 'INVALID_JSON')\n            result[key] = value\n        return result\n    def invalid(value):\n        raise InventoryError('INVALID_JSON')\n    try:\n        value = json.loads(raw.decode('utf-8', errors='strict'),\n                           object_pairs_hook=unique, parse_constant=invalid)\n        def bounded(item, depth=0):\n            require(depth <= 3, 'INVALID_JSON')\n            if type(item) is dict:\n                require(len(item) <= 8, 'INVALID_JSON')\n                for k, v in item.items():\n                    require(type(k) is str and len(k) <= 32, 'INVALID_JSON')\n                    bounded(v, depth + 1)\n            elif type(item) is str:\n                require(len(item) <= 256, 'INVALID_JSON')\n            else:\n                raise InventoryError('INVALID_JSON')\n        bounded(value)\n        return value\n    except InventoryError:\n        raise\n    except Exception:\n        raise InventoryError('INVALID_JSON') from None\n\n\ndef parse_versions(raw):\n    obj = strict_json(raw)\n    require(type(obj) is dict and set(obj) == {'client', 'server'})\n    require(all(type(obj[k]) is str for k in obj))\n    require(all(re.fullmatch(r'[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][A-Za-z0-9.-]{1,40})?',\n                             obj[k]) for k in obj))\n\n\ndef aggregate_images(raw):\n    require(type(raw) is bytes and len(raw) <= STDOUT_LIMIT, 'OUTPUT_LIMIT')\n    lines = [line for line in raw.splitlines() if line.strip()]\n    require(len(lines) <= MAX_ROWS, 'TOO_MANY_ROWS')\n    identities = set()\n    for line in lines:\n        obj = strict_json(line)\n        require(type(obj) is dict and set(obj) == {'repository', 'tag', 'digest', 'image_id'})\n        require(all(type(obj[k]) is str for k in obj))\n        repo, tag, digest, identity = (obj[k] for k in ('repository', 'tag', 'digest', 'image_id'))\n        # Every row is validated, including omitted repositories. No row fields are logged.\n        require(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/:@-]{0,255}|<none>', repo))\n        require(re.fullmatch(r'[A-Za-z0-9_.-]{1,128}|<none>', tag))\n        require(re.fullmatch(r'sha256:[a-f0-9]{64}', identity))\n        require(digest == '<none>' or re.fullmatch(r'sha256:[a-f0-9]{64}', digest))\n        if repo in PUBLIC_REPOSITORIES and digest != '<none>':\n            identities.add((identity, digest))\n    # These are metadata candidates only. Local naming/digests do not prove authenticity,\n    # Linux architecture, runtime closure, patched state or suitability for typegen.\n    return len(lines), len(identities)\n\n\ndef bounded_docker(config, args, overall_deadline, lifecycle):\n    require(tuple(args) in (VERSION_ARGS, IMAGE_ARGS), 'READ_FAILED')\n    deadline = min(overall_deadline, time.monotonic() + 10)\n    require(time.monotonic() < deadline, 'TIMEOUT')\n    command = ['/usr/bin/docker', '--config', config, '--host',\n               'unix:///var/run/docker.sock', *args]\n    proc = None\n    selector = None\n    error = None\n    reaped = False\n    buffers = {'stdout': bytearray(), 'stderr': bytearray()}\n    try:\n        # A failure in the spawn/return window cannot establish that no child exists.\n        lifecycle.process_cleanup = 'UNKNOWN'\n        proc = subprocess.Popen(command, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,\n                                stderr=subprocess.PIPE, env={'PATH': '/usr/bin:/bin'},\n                                cwd='/', close_fds=True, start_new_session=True)\n        lifecycle.process_cleanup = 'UNKNOWN'\n        selector = selectors.DefaultSelector()\n        for stream, label in ((proc.stdout, 'stdout'), (proc.stderr, 'stderr')):\n            os.set_blocking(stream.fileno(), False)\n            selector.register(stream, selectors.EVENT_READ, label)\n        while selector.get_map():\n            remaining = deadline - time.monotonic()\n            require(remaining > 0, 'TIMEOUT')\n            events = selector.select(min(remaining, 0.1))\n            for key, _ in events:\n                label = key.data\n                limit = STDOUT_LIMIT if label == 'stdout' else STDERR_LIMIT\n                # Never store more than the limit; one extra byte detects overflow.\n                chunk = os.read(key.fileobj.fileno(), min(4096, limit - len(buffers[label]) + 1))\n                if not chunk:\n                    selector.unregister(key.fileobj)\n                else:\n                    require(len(chunk) <= limit - len(buffers[label]), 'OUTPUT_LIMIT')\n                    buffers[label].extend(chunk)\n        remaining = deadline - time.monotonic()\n        require(remaining > 0, 'TIMEOUT')\n        try:\n            code = proc.wait(timeout=remaining)\n            reaped = True\n        except subprocess.TimeoutExpired:\n            raise InventoryError('TIMEOUT') from None\n        require(code == 0, 'READ_FAILED')\n    except InventoryError as exc:\n        error = exc\n    except Exception:\n        error = InventoryError('READ_FAILED')\n    except BaseException:\n        lifecycle.cancelled = True\n        error = InventoryError('INTERRUPTED')\n    finally:\n        was_cleaning = lifecycle.cleaning\n        lifecycle.cleaning = True\n        cleanup_failed = False\n        if proc is not None:\n            # Cleanup ownership does not depend on which exception class was raised.\n            # A normally exited CLI must also have no remaining same-group descendants.\n            group_present = True\n            try:\n                os.killpg(proc.pid, 0)\n            except ProcessLookupError:\n                group_present = False\n            except BaseException:\n                cleanup_failed = True\n            if error is not None or lifecycle.cancelled or group_present or not reaped:\n                # One KILL for this newly created session's group; never pkill/retry.\n                try:\n                    os.killpg(proc.pid, signal.SIGKILL)\n                except ProcessLookupError:\n                    pass\n                except BaseException:\n                    cleanup_failed = True\n                try:\n                    proc.wait(timeout=2)\n                    reaped = True\n                except BaseException:\n                    cleanup_failed = True\n                # Bounded observation, not a second termination attempt. Group presence\n                # includes unreaped same-group descendants; absence must be established.\n                absent = False\n                cleanup_deadline = time.monotonic() + 2\n                for _ in range(100):\n                    try:\n                        os.killpg(proc.pid, 0)\n                    except ProcessLookupError:\n                        absent = True\n                        break\n                    except BaseException:\n                        cleanup_failed = True\n                        break\n                    try:\n                        if time.monotonic() >= cleanup_deadline:\n                            break\n                        time.sleep(0.02)\n                    except BaseException:\n                        cleanup_failed = True\n                        break\n                if not absent:\n                    cleanup_failed = True\n            for stream in (proc.stdout, proc.stderr):\n                try:\n                    stream.close()\n                except BaseException:\n                    cleanup_failed = True\n            if not reaped:\n                cleanup_failed = True\n            lifecycle.process_cleanup = 'UNKNOWN' if cleanup_failed else 'PASS'\n        if selector is not None:\n            try:\n                selector.close()\n            except BaseException:\n                cleanup_failed = True\n                lifecycle.process_cleanup = 'UNKNOWN'\n        lifecycle.cleaning = was_cleaning\n        if cleanup_failed:\n            error = InventoryError('CHILD_CLEANUP_UNKNOWN')\n        elif lifecycle.cancelled:\n            error = InventoryError('INTERRUPTED')\n    if error is not None:\n        raise error\n    return bytes(buffers['stdout'])\n\n\ndef result_record(code, cleanup, process_cleanup, rows=0, candidates=0):\n    require(code in CODES and cleanup in ('PASS', 'NOT_CREATED', 'UNKNOWN'))\n    require(type(rows) is int and 0 <= rows <= MAX_ROWS)\n    require(type(candidates) is int and 0 <= candidates <= rows)\n    require(process_cleanup in ('PASS', 'NOT_STARTED', 'UNKNOWN'))\n    return {'schema': 1, 'policy': POLICY,\n            'status': 'INVENTORY_COMPLETE' if code == 'OK' else 'BLOCKED',\n            'reason': code, 'inventory_rows': rows, 'metadata_candidate_count': candidates,\n            'offline_image_suitability': 'UNKNOWN', 'temporary_cleanup': cleanup,\n            'subprocess_cleanup': process_cleanup,\n            'image_selection_approved': False, 'typegen_authorized': False}\n\n\ndef main():\n    config = None\n    creation_started = False\n    cleanup = 'NOT_CREATED'\n    code = 'INTERNAL_ERROR'\n    rows = candidates = 0\n    lifecycle = Lifecycle()\n    deadline = time.monotonic() + 40\n    try:\n        require(sys.platform == 'linux', 'UNSUPPORTED_PLATFORM')\n        lifecycle.install()\n        creation_started = True\n        try:\n            config = tempfile.mkdtemp(prefix='l2e-docker-empty-')\n            os.chmod(config, 0o700)\n            require(stat.S_IMODE(os.stat(config).st_mode) == 0o700, 'SETUP_FAILED')\n        except Exception:\n            raise InventoryError('SETUP_FAILED') from None\n        parse_versions(bounded_docker(config, VERSION_ARGS, deadline, lifecycle))\n        rows, candidates = aggregate_images(bounded_docker(config, IMAGE_ARGS, deadline, lifecycle))\n        code = 'OK' if candidates else 'NO_METADATA_CANDIDATE'\n    except InventoryError as exc:\n        code = exc.code\n    except BaseException:\n        lifecycle.cancelled = True\n        code = 'INTERRUPTED'\n    finally:\n        lifecycle.cleaning = True\n        if config is not None:\n            try:\n                shutil.rmtree(config)\n                require(not os.path.lexists(config), 'TEMP_CLEANUP_FAILED')\n                cleanup = 'PASS'\n            except BaseException:\n                cleanup = 'UNKNOWN'\n                code = 'TEMP_CLEANUP_FAILED'\n        elif creation_started:\n            cleanup = 'UNKNOWN'\n        if not lifecycle.restore():\n            code = 'SIGNAL_RESTORE_FAILED'\n        if lifecycle.process_cleanup == 'UNKNOWN':\n            code = 'CHILD_CLEANUP_UNKNOWN'\n        elif lifecycle.cancelled and code not in ('TEMP_CLEANUP_FAILED', 'SIGNAL_RESTORE_FAILED'):\n            code = 'INTERRUPTED'\n        if code not in ('OK', 'NO_METADATA_CANDIDATE'):\n            rows = candidates = 0\n    print(json.dumps(result_record(code, cleanup, lifecycle.process_cleanup, rows, candidates), sort_keys=True))\n    return 0 if code == 'OK' and cleanup == 'PASS' and lifecycle.process_cleanup == 'PASS' else 1\n\n\nif __name__ == '__main__':\n    try:\n        exit_code = main()\n    except BaseException:\n        # No error detail, raw subprocess output or exception text reaches public logs.\n        print('{\"status\":\"BLOCKED\",\"reason\":\"INTERNAL_ERROR\",'\n              '\"offline_image_suitability\":\"UNKNOWN\",\"temporary_cleanup\":\"UNKNOWN\",'\n              '\"subprocess_cleanup\":\"UNKNOWN\",'\n              '\"image_selection_approved\":false,\"typegen_authorized\":false}')\n        exit_code = 1\n    raise SystemExit(exit_code)\n\nPY\n"
        }
      ]
    }
  }
}
